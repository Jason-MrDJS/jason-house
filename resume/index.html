<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="邓家森 · 简历（PDF）。声音设计师 / 混音师，广西艺术学院。分轨混音 · 贴唱混音 · 声音设计 · 虚拟音源研发。" />
<meta name="theme-color" content="#080A0F" />
<title>邓家森 · 简历 ｜ PDF</title>
<style>
:root{
  --bg:#080A0F;
  --surface:#11141C;
  --ink:#E8E8E8;
  --dim:#9096A3;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --gold:#D6B36A;
  --ai:#5B8CFF;
  --gold-metal:linear-gradient(92deg,#E8CF9C,#D6B36A 55%,#B9954E);
  --grad:linear-gradient(115deg,var(--ai),#8B7CF6 52%,#A78BFA);
  --f-d:"Geist","Inter","Space Grotesk","HarmonyOS Sans SC","HarmonyOS Sans","Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-b:"Inter","Geist","HarmonyOS Sans SC","HarmonyOS Sans","Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(circle at 30% 8%, rgba(91,140,255,.13), transparent 46%),
    radial-gradient(circle at 82% 68%, rgba(214,179,106,.07), transparent 38%),
    linear-gradient(180deg, #090B12, #050507);
  color:var(--ink);font-family:var(--f-b);font-size:16.5px;line-height:1.78;letter-spacing:.012em;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
.bar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
  padding:14px 22px;background:rgba(8,10,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.back{font-family:var(--f-m);font-size:12.5px;color:var(--dim);letter-spacing:.06em}
.back:hover{color:var(--gold)}
.bar b{font-family:var(--f-d);font-weight:600;font-size:16.5px;letter-spacing:.014em}
.bar .sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;
  font-weight:600;font-size:14px;background:var(--grad);color:#fff;
  box-shadow:0 10px 32px -14px rgba(91,140,255,.55);transition:.25s var(--ease);
}
.btn:hover{box-shadow:0 16px 42px -14px rgba(91,140,255,.7)}
.btn--ghost{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink);box-shadow:none}
.btn--ghost:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
main{flex:1;width:min(980px,94vw);margin:26px auto 40px}
.kicker{font-family:var(--f-m);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
h1{font-family:var(--f-d);font-weight:600;font-size:clamp(24px,3.4vw,34px);letter-spacing:.014em;margin-bottom:8px}
.sub{color:var(--dim);font-size:14.5px;margin-bottom:20px}
.sub b{color:var(--gold);font-weight:600}
.sheet{
  position:relative;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  overflow:hidden;box-shadow:0 20px 50px -32px rgba(0,0,0,.55);
}
#pdfFrame{display:block;width:100%;height:calc(100vh - 210px);height:calc(100dvh - 210px);min-height:520px;border:0;background:#161a22}
.fallback{display:none;padding:48px 24px;text-align:center}
.fallback p{color:var(--dim);margin-bottom:18px;font-size:15px}
body.pdf-canvas #pdfFrame{display:none}
body.pdf-canvas .pdf-pages{display:block}
body.no-embed #pdfFrame{display:none}
body.no-embed:not(.pdf-canvas) .fallback{display:block}
.pdf-pages{display:none;background:#0d1017;min-height:200px}
.pdf-pages canvas{display:block;width:100%;height:auto;margin:0 auto 14px;border-radius:8px;box-shadow:0 8px 30px -18px rgba(0,0,0,.8)}
.pdf-loading{padding:36px 20px;text-align:center;font-family:var(--f-m);font-size:12px;letter-spacing:.14em;color:var(--dim)}
.tip{margin-top:16px;font-family:var(--f-m);font-size:11.5px;letter-spacing:.05em;color:var(--dim);text-align:center}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.meta span{font-family:var(--f-m);font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@media (max-width:640px){
  .bar{padding:12px 14px;gap:10px}
  .bar b{font-size:15px}
  main{margin-top:18px}
  #pdfFrame{height:calc(100vh - 240px);height:calc(100dvh - 240px);min-height:420px}
}
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="../">← 返回主页</a>
  <b>邓家森 · 简历</b>
  <span class="sp"></span>
  <a class="btn" href="dengjiasen-resume.pdf" download="邓家森-简历.pdf">↓ 下载 PDF</a>
</header>

<main>
  <div class="kicker">Resume · Sound Designer &amp; Mix Engineer</div>
  <h1>简历<span style="color:var(--gold)">·</span>邓家森</h1>
  <p class="sub">声音设计师 / 混音师 · 广西艺术学院 —— 下载量最高的一份 <b>PDF</b>，也可以直接在下方预览。</p>
  <div class="sheet">
    <iframe id="pdfFrame" src="dengjiasen-resume.pdf#view=FitH" title="邓家森 简历 PDF 预览"></iframe>
    <div class="pdf-pages" id="pdfPages"></div>
    <div class="fallback">
      <p>预览加载失败，点下面直接下载，或用浏览器 / WPS 打开。</p>
      <a class="btn" href="dengjiasen-resume.pdf" download="邓家森-简历.pdf">↓ 下载简历 PDF</a>
    </div>
  </div>
  <div class="meta">
    <span>PDF · 288 KB</span>
    <span>广西艺术学院</span>
    <span>声音设计 / 混音</span>
    <span>1823086554@qq.com</span>
  </div>
  <p class="tip">手机端如无法内嵌预览，会自动显示下载按钮。微信内请点右上角「···」选择浏览器打开后下载。</p>
</main>

<script>
(function(){
  var isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
  if (!isMobile) {
    document.getElementById('pdfFrame').addEventListener('error', function(){
      document.body.classList.add('no-embed');
    });
    return;
  }
  /* 手机端：iframe 内嵌 PDF 不可靠，改用 PDF.js 把每一页画到 canvas。
     pdf-canvas 是持久态：只要画出至少一页就保持显示，不再回退。 */
  document.body.classList.add('no-embed', 'pdf-canvas');
  var box = document.getElementById('pdfPages');
  var tip = document.createElement('div');
  tip.className = 'pdf-loading';
  tip.textContent = 'LOADING PDF · 简历渲染中';
  box.appendChild(tip);

  var fail = function(){
    /* 一页都没画出来时才退回下载按钮 */
    if (!box.querySelector('canvas')) {
      document.body.classList.remove('pdf-canvas');
    }
    document.body.classList.add('no-embed');
    if (tip.parentNode) tip.parentNode.removeChild(tip);
  };

  var s = document.createElement('script');
  s.src = 'pdfjs/pdf.min.js';
  s.onload = function(){
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      pdfjsLib.getDocument('dengjiasen-resume.pdf').promise.then(function(doc){
        if (tip.parentNode) tip.parentNode.removeChild(tip);
        var width = box.clientWidth || Math.floor(document.documentElement.clientWidth * 0.92);
        var done = 0, failed = 0;
        var settle = function(){ if (done + failed === doc.numPages && done === 0) fail(); };
        for (var p = 1; p <= doc.numPages; p++) {
          doc.getPage(p).then(function(page){
            var vp0 = page.getViewport({scale: 1});
            var scale = Math.min((width * dpr) / vp0.width, 2.4);
            var vp = page.getViewport({scale: scale});
            var cv = document.createElement('canvas');
            cv.width = Math.max(1, Math.floor(vp.width));
            cv.height = Math.max(1, Math.floor(vp.height));
            cv.style.aspectRatio = vp.width + '/' + vp.height;
            box.appendChild(cv);
            page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise.then(function(){
              done++; settle();
            }).catch(function(){ failed++; settle(); });
          }).catch(function(){ failed++; settle(); });
        }
      }).catch(fail);
    } catch (e) { fail(); }
  };
  s.onerror = fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
